<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Capture All</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <header class="header-section">
            <div class="logo-area">
                <span class="logo-mark" aria-hidden="true"><span></span></span>
                <div class="logo-text">
                    <h1>Capture All</h1>
                    <p>Local session recorder</p>
                </div>
            </div>
            <div class="status-badge" id="statusBadge" role="status">
                <span class="status-dot" id="statusDot" aria-hidden="true"></span>
                <span id="statusText">Ready</span>
            </div>
        </header>

        <div class="mode-tabs" role="group" aria-label="Recording mode">
            <span class="mode-thumb" aria-hidden="true"></span>
            <button class="mode-tab" id="logModeTab" data-mode="logs" aria-pressed="false">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M3 4.5h10M3 8h10M3 11.5h6"/>
                </svg>
                Logs only
            </button>
            <button class="mode-tab active" id="videoModeTab" data-mode="video" aria-pressed="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                    <rect x="1.75" y="4" width="9" height="8" rx="1.5"/>
                    <path d="M10.75 7l3.5-2v6l-3.5-2"/>
                </svg>
                Video + logs
            </button>
        </div>

        <p class="page-info" id="pageInfo">Select recording mode to begin</p>

        <section class="stats-grid" aria-label="Captured so far">
            <div class="stat-card">
                <div class="stat-value" id="networkCount">0</div>
                <div class="stat-label">Requests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="interactionCount">0</div>
                <div class="stat-label">Interactions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="snapshotCount">0</div>
                <div class="stat-label">Snapshots</div>
            </div>
        </section>

        <div class="video-info-card" id="videoInfoCard" style="display: none;">
            <span class="video-info-icon" aria-hidden="true"></span>
            <div class="video-info-content">
                <div class="video-duration" id="videoDuration">00:00</div>
                <div class="video-size" id="videoSize">Recording video...</div>
            </div>
            <span class="video-info-label">REC</span>
        </div>

        <div class="main-controls">
            <button id="startBtn" class="primary-btn" data-ripple>
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <circle cx="8" cy="8" r="6"/>
                </svg>
                Start recording
            </button>
            <button id="stopBtn" class="secondary-btn" data-ripple disabled>
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <rect x="3" y="3" width="10" height="10" rx="2"/>
                </svg>
                Stop recording
            </button>
        </div>

        <div class="secondary-controls">
            <button id="captureBtn" class="control-btn" data-ripple title="Snapshot the elements on this page">
                <svg class="ic-capture" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path class="corner" d="M2 5V3.5A1.5 1.5 0 013.5 2H5"/>
                    <path class="corner" d="M11 2h1.5A1.5 1.5 0 0114 3.5V5"/>
                    <path class="corner" d="M14 11v1.5a1.5 1.5 0 01-1.5 1.5H11"/>
                    <path class="corner" d="M5 14H3.5A1.5 1.5 0 012 12.5V11"/>
                    <circle class="lens" cx="8" cy="8" r="2"/>
                </svg>
                <span>Capture</span>
            </button>
            <button id="exportBtn" class="control-btn accent" data-ripple title="Download everything as one .zip">
                <svg class="ic-export" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path class="arrow" d="M8 2.5v7.5M4.75 7L8 10.25 11.25 7"/>
                    <path d="M3 13.5h10"/>
                </svg>
                <span>Export .zip</span>
            </button>
            <button id="clearBtn" class="control-btn danger" data-ripple title="Delete all captured data">
                <svg class="ic-clear" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path class="lid" d="M2.5 4.5h11M6.5 4.5V3a1 1 0 011-1h1a1 1 0 011 1v1.5"/>
                    <path d="M4 4.5l.6 8.1a1.5 1.5 0 001.5 1.4h3.8a1.5 1.5 0 001.5-1.4l.6-8.1"/>
                </svg>
                <span>Clear</span>
            </button>
        </div>

        <footer class="footer-info">
            <div class="info-text">
                <svg class="ic-lock" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="7" width="10" height="7" rx="1.5"/>
                    <path class="shackle" d="M5.5 7V5a2.5 2.5 0 015 0v2"/>
                </svg>
                <span>Everything stays on this device</span>
                <span id="extVersion" class="ext-version"></span>
            </div>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>

</html>
